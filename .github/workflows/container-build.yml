name: Container Build Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-containers:
    name: Build Container Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install Bandit SAST scanner
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit==1.9.4

      - name: Run Bandit SAST security gate
        run: |
          bandit -r services \
            --severity-level medium \
            --confidence-level medium

      - name: Build API service image
        run: |
          docker build \
            -t devsecops-api:${{ github.sha }} \
            services/api-service

      - name: Build worker service image
        run: |
          docker build \
            -t devsecops-worker:${{ github.sha }} \
            services/worker-service

      - name: Verify container images
        run: |
          docker image inspect devsecops-api:${{ github.sha }}
          docker image inspect devsecops-worker:${{ github.sha }}

      - name: Create SBOM output directory
        run: mkdir -p sbom

      - name: Generate API CycloneDX SBOM with Syft
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: devsecops-api:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom/api-sbom.cyclonedx.json
          artifact-name: api-cyclonedx-sbom
          upload-artifact: true
          upload-release-assets: false

      - name: Generate worker CycloneDX SBOM with Syft
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: devsecops-worker:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom/worker-sbom.cyclonedx.json
          artifact-name: worker-cyclonedx-sbom
          upload-artifact: true
          upload-release-assets: false

      - name: Verify generated SBOM files
        run: |
          test -s sbom/api-sbom.cyclonedx.json
          test -s sbom/worker-sbom.cyclonedx.json
          echo "API and worker CycloneDX SBOMs generated successfully."

      - name: Scan API SBOM with Grype
        id: grype-api
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom/api-sbom.cyclonedx.json
          output-format: table
          severity-cutoff: high
          only-fixed: true
          fail-build: true

      - name: Scan worker SBOM with Grype
        id: grype-worker
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom/worker-sbom.cyclonedx.json
          output-format: table
          severity-cutoff: high
          only-fixed: true
          fail-build: true

      - name: Enforce HIGH and CRITICAL vulnerability gate
        if: always()
        run: |
          echo "API Grype result: ${{ steps.grype-api.outcome }}"
          echo "Worker Grype result: ${{ steps.grype-worker.outcome }}"

          if [[ "${{ steps.grype-api.outcome }}" == "failure" || \
                "${{ steps.grype-worker.outcome }}" == "failure" ]]; then
            echo "Security gate FAILED."
            echo "A HIGH or CRITICAL vulnerability with a known fix was detected."
            exit 1
          fi

          echo "Security gate PASSED."
          echo "No HIGH or CRITICAL vulnerabilities with known fixes were detected."