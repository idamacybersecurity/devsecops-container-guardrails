name: Policy as Code

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  conftest:
    name: OPA Rego Policy Validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Conftest
        run: |
          CONFTEST_VERSION="0.70.1"
          curl -sSL -o conftest.tar.gz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf conftest.tar.gz
          sudo mv conftest /usr/local/bin/conftest
          conftest --version

      - name: Validate Kubernetes security policies
        run: |
          conftest test \
            --policy policies/kubernetes \
            --output table \
            k8s/api-deployment.yaml \
            k8s/worker-deployment.yaml

      - name: Validate Dockerfile security policies
        run: |
          conftest test \
            --parser dockerfile \
            --policy policies/dockerfile \
            --output table \
            services/api-service/Dockerfile \
            services/worker-service/Dockerfile

  terraform-opa:
    name: Terraform OPA Security Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      localstack_token_available: ${{ steps.token-check.outputs.available }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: Install Conftest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="0.71.1"
          ARCHIVE="conftest_${VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLo "/tmp/${ARCHIVE}" \
            "https://github.com/open-policy-agent/conftest/releases/download/v${VERSION}/${ARCHIVE}"
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp conftest
          sudo install /tmp/conftest /usr/local/bin/conftest
          conftest --version

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive cloud-control-plane-defense/terraform

      - name: Initialize Terraform without a backend
        run: terraform -chdir=cloud-control-plane-defense/terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate Terraform configuration
        run: terraform -chdir=cloud-control-plane-defense/terraform validate

      - name: Run Rego unit tests (every rule has a deny and an allow case)
        run: conftest verify --policy cloud-control-plane-defense/policies

      - name: Validate compliant OPA fixture
        run: |
          conftest test \
            --policy cloud-control-plane-defense/policies \
            cloud-control-plane-defense/policies/fixtures/valid-plan.json

      - name: Validate adversarial OPA fixture
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT

          if conftest test \
            --policy cloud-control-plane-defense/policies \
            cloud-control-plane-defense/policies/fixtures/invalid-plan.json >"$output" 2>&1; then
            cat "$output"
            echo "ERROR: Adversarial fixture unexpectedly passed."
            exit 1
          else
            status=$?
          fi

          cat "$output"
          failures="$(grep -c 'FAIL' "$output" || true)"

          if [[ "$status" -eq 0 || "$failures" -ne 8 ]]; then
            echo "ERROR: Expected exactly 8 rejected violations; found $failures."
            exit 1
          fi

          echo "PASS: All 8 adversarial violations were rejected."

      - name: Check LocalStack CI secret availability
        id: token-check
        shell: bash
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: |
          if [[ -n "${LOCALSTACK_AUTH_TOKEN:-}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "LocalStack integration credentials are available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::LocalStack integration skipped: LOCALSTACK_AUTH_TOKEN is unavailable."
            echo "### LocalStack integration not run" >> "$GITHUB_STEP_SUMMARY"
            echo "Configure the repository secret LOCALSTACK_AUTH_TOKEN to enable the integration gate." >> "$GITHUB_STEP_SUMMARY"
          fi

  localstack-terraform-plan:
    name: Fresh LocalStack Terraform Plan and OPA Gate
    runs-on: ubuntu-24.04
    needs: terraform-opa
    if: needs.terraform-opa.outputs.localstack_token_available == 'true'
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: Install Conftest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="0.71.1"
          ARCHIVE="conftest_${VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLo "/tmp/${ARCHIVE}" \
            "https://github.com/open-policy-agent/conftest/releases/download/v${VERSION}/${ARCHIVE}"
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp conftest
          sudo install /tmp/conftest /usr/local/bin/conftest
          conftest --version

      - name: Start isolated LocalStack
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          docker run -d \
            --name ccpd-ci-localstack \
            -p 4566:4566 \
            -e LOCALSTACK_AUTH_TOKEN \
            -e DEBUG=0 \
            localstack/localstack:2026.10.7

          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4566/_localstack/health >/dev/null; then
              echo "LocalStack health endpoint is responding."
              exit 0
            fi

            if [[ "$(docker inspect -f '{{.State.Running}}' ccpd-ci-localstack 2>/dev/null || true)" != "true" ]]; then
              docker logs ccpd-ci-localstack
              echo "ERROR: LocalStack stopped before becoming healthy."
              exit 1
            fi

            sleep 5
          done

          docker logs ccpd-ci-localstack
          echo "ERROR: LocalStack did not become healthy within 5 minutes."
          exit 1

      - name: Initialize isolated Terraform state
        run: terraform -chdir=cloud-control-plane-defense/terraform init -backend=false -input=false -lockfile=readonly

      - name: Run complete Terraform OPA security gate
        run: bash cloud-control-plane-defense/scripts/validate_opa.sh

      - name: Collect LocalStack logs on failure
        if: failure()
        run: docker logs ccpd-ci-localstack

      - name: Stop LocalStack
        if: always()
        run: docker rm -f ccpd-ci-localstack || true
