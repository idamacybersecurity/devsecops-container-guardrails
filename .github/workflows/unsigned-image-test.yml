name: Unsigned Image Deployment Gate Test

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  unsigned-image-test:
    name: Prove Unsigned Image Is Blocked
    runs-on: ubuntu-24.04

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build unique unsigned test image
        run: |
          cat > Dockerfile.unsigned-test <<'EOF'
          FROM alpine:3.22
          ARG TEST_ID
          LABEL devsecops.unsigned-test="${TEST_ID}"
          CMD ["echo", "Unsigned deployment gate test"]
          EOF

          docker build \
            --build-arg TEST_ID="${{ github.run_id }}-${{ github.run_attempt }}" \
            -f Dockerfile.unsigned-test \
            -t ghcr.io/idamacybersecurity/devsecops-unsigned-test:${{ github.run_id }} \
            .

      - name: Publish unsigned test image
        run: |
          IMAGE="ghcr.io/idamacybersecurity/devsecops-unsigned-test:${{ github.run_id }}"
          docker push "${IMAGE}"

          DIGEST_REF=$(docker inspect \
            --format='{{index .RepoDigests 0}}' \
            "${IMAGE}")

          echo "UNSIGNED_IMAGE_DIGEST=${DIGEST_REF}" >> "$GITHUB_ENV"
          echo "Unsigned test image: ${DIGEST_REF}"
          echo "This image is intentionally NOT signed."

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify unsigned image with Cosign
        run: |
          CERT_IDENTITY="https://github.com/idamacybersecurity/devsecops-container-guardrails/.github/workflows/container-build.yml@refs/heads/main"
          OIDC_ISSUER="https://token.actions.githubusercontent.com"

          echo "Attempting to verify intentionally unsigned image..."

          cosign verify "${UNSIGNED_IMAGE_DIGEST}" \
            --certificate-identity="${CERT_IDENTITY}" \
            --certificate-oidc-issuer="${OIDC_ISSUER}"

      - name: Authorize deployment
        run: |
          echo "DEPLOYMENT AUTHORIZED."