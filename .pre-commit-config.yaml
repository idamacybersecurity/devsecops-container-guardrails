repos:
  - repo: https://github.com/open-policy-agent/conftest
    rev: v0.70.1
    hooks:
      - id: conftest-test
        name: Check Kubernetes security policies
        files: ^k8s/.*\.ya?ml$
        args:
          - --policy
          - policies/kubernetes
          - --output
          - table

      - id: conftest-test
        name: Check Dockerfile security policies
        files: ^services/.*/Dockerfile$
        args:
          - --parser
          - dockerfile
          - --policy
          - policies/dockerfile
          - --output
          - table

  - repo: local
    hooks:
      - id: trufflehog
        name: TruffleHog secret scan
        entry: ./trufflehog-bin/trufflehog.exe git file://.
        language: system
        pass_filenames: false
        args:
          - --fail
          - --trust-local-git-config
          - --config=trufflehog-config.yaml
