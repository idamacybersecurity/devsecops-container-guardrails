apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: ai-agent-dash-exec-enforce
spec:
  lsmhooks:
  - hook: bprm_check_security
    args:
    - index: 0
      type: linux_binprm
    selectors:
    - matchNamespaces:
      - namespace: Pid
        operator: In
        values:
        - "4026532215"
      matchArgs:
      - index: 0
        operator: Equal
        values:
        - /usr/bin/dash
      matchActions:
      - action: Sigkill
