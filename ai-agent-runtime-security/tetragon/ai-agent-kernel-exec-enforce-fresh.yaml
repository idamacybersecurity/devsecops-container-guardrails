apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: ai-agent-kernel-exec-enforce-fresh
spec:
  lsmhooks:
  - hook: bprm_check_security
    args:
    - index: 0
      type: linux_binprm
    selectors:
    - matchNamespaces:
      - namespace: Pid
        operator: In
        values:
        - "4026532585"
      matchArgs:
      - index: 0
        operator: Equal
        values:
        - /bin/bash
        - /usr/bin/bash
        - /usr/bin/dash
      matchActions:
      - action: Sigkill
