apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: ai-agent-kernel-multi-exec
spec:
  lsmhooks:
  - hook: bprm_check_security
    args:
    - index: 0
      type: linux_binprm
    selectors:
    - matchNamespaces:
      - namespace: Pid
        operator: In
        values:
        - "4026532645"
      matchArgs:
      - index: 0
        operator: Equal
        values:
        - /usr/bin/curl
        - /usr/bin/wget
        - /usr/bin/nc
      matchActions:
      - action: Sigkill
