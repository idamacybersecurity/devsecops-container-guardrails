name: cloud-control-plane-defense

services:
  localstack:
    image: localstack/localstack:2026.11.0
    container_name: cloud-control-plane-localstack
    env_file:
      - .env
    environment:
      DEBUG: "0"
      ENFORCE_IAM: "1"
      PERSISTENCE: "1"
      SNAPSHOT_SAVE_STRATEGY: "ON_SHUTDOWN"
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - "./volume:/var/lib/localstack"
    restart: unless-stopped
