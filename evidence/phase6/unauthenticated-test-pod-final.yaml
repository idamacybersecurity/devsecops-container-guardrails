apiVersion: v1
kind: Pod
metadata:
  name: mtls-negative-proof
  namespace: devsecops-test
  labels:
    app: mtls-negative-proof
spec:
  restartPolicy: Never
  containers:
    - name: probe
      image: phase6-mtls-python:app
      imagePullPolicy: IfNotPresent
      command:
        - python
        - -c
        - |
          import socket, ssl, sys
          host = "mtls-server.devsecops-test.svc.cluster.local"
          ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          try:
              with socket.create_connection((host, 8443), timeout=8) as raw:
                  with ctx.wrap_socket(raw, server_hostname=host) as tls:
                      print("FAIL: TLS handshake succeeded without a client certificate", flush=True)
                      sys.exit(1)
          except ssl.SSLError as exc:
              print("PASS: TLS handshake rejected without a client certificate", flush=True)
              print(type(exc).__name__ + ": " + str(exc), flush=True)
              sys.exit(0)
          except OSError as exc:
              print("INCONCLUSIVE: connection/network error, not proof of certificate rejection", flush=True)
              print(type(exc).__name__ + ": " + str(exc), flush=True)
              sys.exit(2)
