      import socket, ssl
      host = "mtls-server.devsecops-test.svc.cluster.local"
      context = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
      context.check_hostname = False
      context.verify_mode = ssl.CERT_NONE
      try:
          with socket.create_connection((host, 8443), timeout=5) as raw:
              with context.wrap_socket(raw, server_hostname=host) as tls:
                  print("UNEXPECTED: TLS connection succeeded without a client certificate")
                  raise SystemExit(1)
      except (ssl.SSLError, OSError) as exc:
          print("EXPECTED REJECTION: unauthenticated TLS connection failed")
          print(type(exc).__name__ + ":", exc)
