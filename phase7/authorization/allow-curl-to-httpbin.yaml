apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-curl-to-httpbin
  namespace: phase7-mtls
spec:
  selector:
    matchLabels:
      app: httpbin
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/phase7-mtls/sa/curl"
      to:
        - operation:
            methods: ["GET"]
            ports: ["8080"]
