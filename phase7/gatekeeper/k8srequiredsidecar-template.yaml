apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequiredsidecar
spec:
  crd:
    spec:
      names:
        kind: K8sRequiredSidecar
      validation:
        openAPIV3Schema:
          type: object
          properties:
            requiredContainers:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequiredsidecar

        violation[{"msg": msg}] {
          required := input.parameters.requiredContainers[_]
          not container_exists(required)
          msg := sprintf("Pod must include required sidecar container %q", [required])
        }

        container_exists(name) {
          container := input.review.object.spec.containers[_]
          container.name == name
        }

        container_exists(name) {
          container := input.review.object.spec.initContainers[_]
          container.name == name
        }
