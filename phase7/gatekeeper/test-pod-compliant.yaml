apiVersion: v1
kind: Pod
metadata:
  name: compliant-security-test
  namespace: phase7-gatekeeper-test
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        privileged: false
        capabilities:
          drop: ["ALL"]
