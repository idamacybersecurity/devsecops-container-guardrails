apiVersion: v1
kind: Pod
metadata:
  name: openat2-probe
  namespace: runtime-security-test
  labels:
    app: openat2-probe
spec:
  restartPolicy: Never
  containers:
    - name: probe
      image: python:3.12-slim
      imagePullPolicy: IfNotPresent
      command: ["python3", "-c", "import time; time.sleep(36000)"]
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: false
        capabilities:
          drop:
            - ALL
